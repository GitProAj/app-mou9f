    <div class="logout-container">
      <div class="logout-card" *ngIf="!isLoggedOut; else loggedOut">
        <div class="icon">👋</div>
        <h2>Déconnexion</h2>
        <p class="user-info" *ngIf="username">
          Connecté en tant que <strong>{{ username }}</strong>
        </p>
        <p>Voulez-vous vraiment vous déconnecter ?</p>
        
        <div class="actions">
          <button class="btn-cancel" (click)="cancel()" [disabled]="loading">
            Annuler
          </button>
          <button class="btn-logout" (click)="logout()" [disabled]="loading">
            <span *ngIf="!loading">Se déconnecter</span>
            <span *ngIf="loading" class="spinner"></span>
          </button>
        </div>
      </div>
      
      <ng-template #loggedOut>
        <div class="logout-card success">
          <div class="icon">✅</div>
          <h2>Déconnecté avec succès</h2>
          <p>Vous allez être redirigé...</p>
          <div class="spinner"></div>
        </div>
      </ng-template>
    </div>

<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Logo Section -->
  <div class="sidebar-header">
    <div class="logo">
        <button (click)="toggleSidebar()" class="btn-menu"><img src="assets/menu.png" alt="menu" class="menu-img"  [class.collapsed-icon]="isCollapsed"></button> 
        <div class="logo-img-text" *ngIf="!isCollapsed">
          <img src="assets/logomou9f.jpg" alt="Logo" class="logo-img">
          <span class="logo-text">harfa</span>
        </div>
    </div>
    
  </div>
  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <div class="line"></div>
    <ul class="nav-menu">
      <li class="nav-item" *ngFor="let item of menuItems">
        <a 
          [routerLink]="item.link" 
          (click)="setActive(item)" 
          class="nav-link"
          [class.active]="item.active"
        >
          <!-- <i class="icon icon-{{item.icon}}"></i> -->
          <img class="image" src="assets/{{item.image}}" alt="User">
          <span *ngIf="!isCollapsed" class="label">{{item.label}}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer Section -->
  <div class="sidebar-footer">
    <!-- <div class="user-info"> -->
      <!-- <div class="user-avatar">
        <img src="assets/avatar.jpg" alt="User">
      </div>
      <div class="user-details">
        <span class="user-name">Client</span>
        <span class="user-role">User</span>
      </div> -->
    <!-- </div> -->
    <a routerLink="/logout" class="logout-link"><img class="logout-img" src="assets/se-deconnecter.png" alt="User">
       <span *ngIf="!isCollapsed"  class="span-deconecte">Déconecté</span> 
      <!-- <i class="icon icon-logout"></i> -->
    </a>
  </div>
</aside>

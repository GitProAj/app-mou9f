spring.application.name=app-mou9f
server.port=9000
spring.thymeleaf.cache=false
# Activer le hot reload (Spring Boot DevTools)
spring.devtools.restart.enabled=true
# Optionnel : recharger les templates sans redémarrer (fonctionne avec DevTools)
spring.devtools.livereload.enabled=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

spring.datasource.url=jdbc:mysql://localhost:3306/mou9feDb
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Connexion · OAuth2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 20% 50%, #d4e4f7 0%, #b8d0e8 40%, #8eb4d4 100%);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Orbes flottants décoratifs */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #6b9fd4;
            top: -10%;
            left: -5%;
            animation-delay: 0s;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #a3c6e9;
            bottom: -15%;
            right: -8%;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.2); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 92vh;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.70);
            box-shadow:
                0 30px 80px rgba(20, 50, 80, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.60);
            padding: 2.75rem 2.25rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .login-container:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow:
                0 40px 100px rgba(20, 50, 80, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.70);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .badge-pill {
            display: inline-block;
            background: rgba(26, 59, 92, 0.08);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #1a3b5c;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 0.75rem;
        }

        .login-header {
            margin-bottom: 2rem;
            text-align: left;
        }

        .login-header h2 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.03em;
            color: #0b1d2e;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        .login-header p {
            color: #3d5a78;
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.85;
        }

        /* Messages d'erreur/succès - version statique pour démonstration */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 450;
            margin-bottom: 1.25rem;
            background: rgba(229, 62, 62, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(229, 62, 62, 0.15);
            color: #9b2c2c;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-success {
            background: rgba(56, 161, 105, 0.08);
            border-color: rgba(56, 161, 105, 0.15);
            color: #22543d;
        }

        /* Cache les alertes par défaut - pour démonstration */
        .alert.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a3b5c;
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 0.95rem;
            border: 1.5px solid rgba(255, 255, 255, 0.50);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
            outline: none;
            font-family: inherit;
            color: #0b1d2e;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-group input:focus {
            border-color: #1a3b5c;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 6px rgba(26, 59, 92, 0.08), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-group input::placeholder {
            color: #8aa3bb;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            font-family: inherit;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #0b1d2e;
            color: white;
            box-shadow: 0 6px 20px rgba(11, 29, 46, 0.25);
            margin-bottom: 0.75rem;
        }

        .btn-primary:hover {
            background: #1a3b5c;
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(11, 29, 46, 0.30);
        }

        .btn-google {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(4px);
            color: #1a3b5c;
            border: 1.5px solid rgba(255, 255, 255, 0.90);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .btn-google:hover {
            background: #ffffff;
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 20, 40, 0.10);
        }

        .btn-google img {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0 0.25rem;
            color: rgba(61, 90, 120, 0.50);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.50);
        }

        .footer-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.8rem;
        }

        .footer-links a {
            color: #1a3b5c;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                border-radius: 28px;
            }

            .login-header h2 {
                font-size: 1.6rem;
            }

            .btn {
                font-size: 0.9rem;
                padding: 0.75rem 1.2rem;
            }

            .footer-links {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <span class="badge-pill">🔐 Sécurisé</span>
        <h2>Bonjour</h2>
        <p>Connectez-vous pour continuer</p>
    </div>

    <!-- Formulaire standard - action à modifier selon votre backend -->
    <form method="post" action="/login">
        <!-- Messages d'état - vous pouvez les afficher/cacher avec JavaScript ou CSS -->
        <div class="alert hidden" role="alert">
            <span>✕</span> Identifiant ou mot de passe incorrect.
        </div>
        <div class="alert alert-success hidden" role="alert">
            <span>✓</span> Vous avez été déconnecté avec succès.
        </div>

        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" placeholder="utilisateur@exemple.com" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button class="btn btn-primary" type="submit">
            Se connecter
        </button>

        <div class="divider">ou</div>

        <a class="btn btn-google" href="/oauth2/authorization/google-idp" role="link">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Google_%22G%22_Logo.svg/512px-Google_%22G%22_Logo.svg.png" alt="Google" />
            Continuer avec Google
        </a>

        <div class="footer-links">
            <a href="#">Mot de passe oublié ?</a>
            <a href="http://127.0.0.1:8081/home/signup">Créer un compte</a>
        </div>
    </form>
</div>

<!-- Petit script pour montrer comment gérer les messages -->
<script>
    // Exemple : afficher un message d'erreur si l'URL contient ?error
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
        document.querySelector('.alert:not(.alert-success)').classList.remove('hidden');
    }
    if (urlParams.has('logout')) {
        document.querySelector('.alert-success').classList.remove('hidden');
    }
</script>
</body>
</html>

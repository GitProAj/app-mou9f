<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>tutorial oauth2</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
    <link href="https://getbootstrap.com/docs/4.0/examples/signin/signin.css" rel="stylesheet" crossorigin="anonymous"/>
</head>
<body>
<h1>Autorisation requise</h1>
<p>L'application <strong th:text="${client.clientId}"></strong> demande accès à:</p>

<ul th:if="${scopes}">
    <li th:each="scope : ${scopes}" th:text="${scope}"></li>
</ul>

<form th:action="@{/oauth/authorize}" method="post">
    <input type="hidden" name="user_oauth_approval" value="true"/>
    <button type="submit">Autoriser</button>
</form>

<form th:action="@{/oauth/authorize}" method="post">
    <input type="hidden" name="user_oauth_approval" value="false"/>
    <button type="submit">Refuser</button>
</form>
</body>
</html>
